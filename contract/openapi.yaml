openapi: "3.1.0"
info:
  title: FlashCard API
  description: API for FlashCard learning assistant app
  version: "1.0.0"
servers:
  - url: http://localhost:8000/v1
    description: Local development
  - url: https://api.example.com/v1
    description: Production (future)
paths: {}
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas: {}
  responses:
    UnauthorizedError:
      description: Access token missing or invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
