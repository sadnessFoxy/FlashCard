          type: string
          format: email
          maxLength: 254
        password:
          type: string
          maxLength: 1024
          description: Strength rules are checked by the server (`WEAK_PASSWORD`), see the spec.
        locale:
          $ref: "#/components/schemas/Locale"
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          maxLength: 254
        password:
          type: string
          maxLength: 1024
