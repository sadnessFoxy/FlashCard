          maxLength: 200
          description: Trimmed and whitespace-collapsed by the server; must then be 1-100 characters.
    Deck:
      type: object
      additionalProperties: false
      required: [id, space_id, name, card_count, due_count, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        space_id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 100
        card_count:
          type: integer
          minimum: 0
        due_count:
          type: integer
          minimum: 0
