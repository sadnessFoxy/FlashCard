      type: object
      additionalProperties: false
      required: [id, space_id, filename, file_kind, text_source, size_bytes, page_count, status, error_code, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        space_id:
          type: string
          format: uuid
        filename:
          type: string
