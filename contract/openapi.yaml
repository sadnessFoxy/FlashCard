          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttemptResult"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/CsrfRejected"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
components:
  parameters:
    SpaceId:
      name: space_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ConversationId:
      name: conversation_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ClientPlatform:
      name: X-Client-Platform
      in: header
      required: true
      description: "`native` returns tokens in the body; `web` sets httpOnly cookies and omits tokens."
      schema:
        type: string
        enum: [web, native]
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token (native clients).
    CookieAuth:
      type: apiKey
      in: cookie
      name: access_token
      description: httpOnly access token cookie (web clients). Unsafe methods also require an allowed `Origin`.
  schemas:
    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Machine-readable error code; the client maps it to an i18n message.
          examples: [VALIDATION_ERROR]
        message:
          type: string
          description: Developer-facing message. Not shown to end users.
        reason:
          type: string
          description: "Set with `WEAK_PASSWORD`."
          enum: [too_short, too_long, too_common, same_as_email]
        retry_after_seconds:
          type: integer
          minimum: 1
          description: "Set with `TOO_MANY_ATTEMPTS`; also sent as the `Retry-After` header."
        version:
          type: string
          description: "Set with `CONSENT_REQUIRED`: the notice version to accept."
        current_version:
          type: string
          description: "Set with `VALIDATION_ERROR` from POST /v1/me/consents."
        max_documents:
          type: integer
          description: "Set with `DOCUMENT_LIMIT_REACHED`."
        max_pages:
          type: integer
          description: "Set with `TOO_MANY_PAGES`."
        max_size_mb:
          type: integer
          description: "Set with `FILE_TOO_LARGE`."
        status:
          type: string
          description: "Set with `DOCUMENT_NOT_RETRYABLE`: the document's current status."
        max_cards:
          type: integer
          description: "Set with `DECK_FULL`."
        quota_remaining:
          type: integer
          minimum: 0
          description: "Set with `USER_QUOTA_EXCEEDED`."
        quota_reset_at:
          type: string
          format: date-time
          description: "Set with `USER_QUOTA_EXCEEDED`: when the daily quota resets."
        errors:
          type: array
          description: "Set with `VALIDATION_ERROR`: which fields are invalid."
          items:
            type: object
            required: [field, type]
            properties:
              field:
                type: string
                examples: [email]
              type:
                type: string
                examples: [value_error]
    UsageCounter:
      type: object
      additionalProperties: false
      required: [daily_limit, used_today, remaining, resets_at]
      properties:
        daily_limit:
          type: integer
        used_today:
          type: integer
        remaining:
          type: integer
          minimum: 0
        resets_at:
          type: string
          format: date-time
    Usage:
      type: object
      additionalProperties: false
      description: Top-level fields are the daily question quota; each other AI feature has its own counter.
      required: [daily_limit, used_today, remaining, resets_at, card_suggestions, quizzes, summaries]
      properties:
        daily_limit:
          type: integer
        used_today:
          type: integer
        remaining:
          type: integer
          minimum: 0
        resets_at:
          type: string
          format: date-time
        card_suggestions:
          $ref: "#/components/schemas/UsageCounter"
        quizzes:
          $ref: "#/components/schemas/UsageCounter"
        summaries:
          $ref: "#/components/schemas/UsageCounter"
    CreateConversationRequest:
      type: object
      additionalProperties: false
      required: [space_id]
      properties:
        space_id:
          type: string
          format: uuid
    Conversation:
      type: object
      additionalProperties: false
      required: [id, space_id, title, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        space_id:
          type: string
          format: uuid
        title:
          type: [string, "null"]
          maxLength: 80
          description: First question, cut to 80 characters; null until the first question.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ConversationList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Conversation"
    ConversationDetail:
      type: object
      additionalProperties: false
      required: [id, space_id, title, created_at, updated_at, messages]
      properties:
        id:
          type: string
          format: uuid
        space_id:
          type: string
          format: uuid
        title:
          type: [string, "null"]
          maxLength: 80
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        messages:
          type: array
          items:
            $ref: "#/components/schemas/Message"
    SendMessageRequest:
      type: object
      additionalProperties: false
      required: [content]
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 2000
          description: The question; trimmed, must not be blank.
        document_ids:
          type: [array, "null"]
          maxItems: 100
          description: |
            Ask only these documents. Omitted or null means every READY document in the space.
            IDs that are not the caller's READY documents in this space are ignored.
          items:
            type: string
            format: uuid
    Citation:
      type: object
      additionalProperties: false
      required: [index, document_id, document_name, page_start, page_end, snippet]
      description: Snapshot saved with the message, so it still shows after the document is deleted.
      properties:
        index:
          type: integer
          minimum: 1
          description: The number used as [n] in the answer.
        document_id:
          type: [string, "null"]
          format: uuid
          description: Null once the document has been deleted.
        document_name:
          type: string
        page_start:
          type: integer
          minimum: 1
        page_end:
          type: integer
          minimum: 1
        snippet:
          type: string
    MessageMode:
      type: string
      enum: [question, answer, retrieval_only, not_found]
      description: |
        `question` for the user's message. For answers: `answer` (AI answer with citations),
        `retrieval_only` (AI unavailable, only the matching passages), `not_found` (nothing relevant).
    Message:
      type: object
      additionalProperties: false
      required: [id, conversation_id, role, content, mode, status, error_code, citations, document_ids, created_at]
      properties:
        id:
          type: string
          format: uuid
        conversation_id:
          type: string
          format: uuid
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
          description: Empty for `not_found` and `retrieval_only`; the client shows a localized text.
        mode:
          $ref: "#/components/schemas/MessageMode"
        status:
          type: string
          enum: [pending, complete, partial, error]
          description: "`partial`: the stream broke after some text; `error`: it broke before any."
        error_code:
          type: [string, "null"]
        citations:
          type: array
          items:
            $ref: "#/components/schemas/Citation"
        document_ids:
          type: [array, "null"]
          description: The document selection used for the question; null means all.
          items:
            type: string
            format: uuid
        created_at:
          type: string
          format: date-time
    ChatStartEvent:
      type: object
      additionalProperties: false
      required: [user_message, assistant_message_id, mode]
      properties:
        user_message:
          $ref: "#/components/schemas/Message"
        assistant_message_id:
          type: string
          format: uuid
        mode:
          type: string
          enum: [answer, retrieval_only, not_found]
    ChatCitationsEvent:
      type: object
      additionalProperties: false
      required: [citations]
      properties:
        citations:
          type: array
          items:
            $ref: "#/components/schemas/Citation"
    ChatDeltaEvent:
      type: object
      additionalProperties: false
      required: [text]
      properties:
        text:
          type: string
    ChatDoneEvent:
      type: object
      additionalProperties: false
      required: [message]
      properties:
        message:
          $ref: "#/components/schemas/Message"
    ChatErrorEvent:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          examples: [AI_TEMPORARILY_UNAVAILABLE, USER_QUOTA_EXCEEDED]
        message:
          type: string
          description: Developer-facing; the client maps `code` to an i18n message.
        quota_reset_at:
          type: string
          format: date-time
    DocumentPage:
      type: object
      additionalProperties: false
      required: [document_id, filename, page, page_count, paragraphs]
      properties:
        document_id:
          type: string
          format: uuid
        filename:
          type: string
        page:
          type: integer
          minimum: 1
        page_count:
          type: integer
          minimum: 1
        paragraphs:
          type: array
          description: Page text in reading order; empty when the page has no text layer.
          items:
            type: string
    DeckNameRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          maxLength: 200
