      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        email_verified:
          type: boolean
        locale:
          $ref: "#/components/schemas/Locale"
        role:
          type: string
          enum: [user, admin]
        created_at:
          type: string
          format: date-time
    AuthSession:
      type: object
      additionalProperties: false
      required: [user, access_token_expires_in]
      properties:
        user:
          $ref: "#/components/schemas/User"
        access_token:
          type: string
          description: Native only. Absent for web clients.
        refresh_token:
          type: string
          description: Native only. Absent for web clients.
        access_token_expires_in:
          type: integer
          description: Seconds until the access token expires.
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status, environment, version]
