openapi: "3.1.0"
info:
  title: FlashCard API
  description: |
    API for the FlashCard learning assistant app.
    Contract-first: this file is the single source of truth (see contract/README.md).
  version: "1.0.0"
servers:
  - url: http://localhost:8000
    description: Local development
tags:
  - name: system
    description: Liveness and dependency status
  - name: auth
    description: |
      Email + password sign-up, sign-in, session refresh and sign-out (spec: docs/specs/f2-email-auth.md).
      Native clients receive tokens in the JSON body and keep them in secure storage.
      Web clients receive httpOnly cookies instead and never see tokens (R12).
  - name: users
    description: The signed-in user
  - name: documents
    description: |
      PDF upload and background ingestion to READY (spec: docs/specs/f5-document-upload.md).
      Status follows the state machine in docs/DATA_MODEL.md; clients poll while UPLOADED, QUEUED or PROCESSING.
  - name: spaces
    description: |
      Study spaces that group documents, chats, decks and quizzes (spec: docs/specs/f4b-spaces.md).
      Other users' spaces always answer 404, never 403.
  - name: chat
    description: |
      Questions over the caller's READY documents in a space, answered with page citations (spec: docs/specs/f7-qa.md).
      Answers stream as Server-Sent Events. Other users' conversations answer 404.
  - name: usage
    description: The caller's daily question quota
  - name: flashcards
    description: |
      Decks and cards in a space; the AI only suggests cards, the learner saves them (spec: docs/specs/f9-flashcards.md).
      Other users' decks and cards always answer 404.
  - name: reviews
    description: |
      Spaced repetition with SM-2; no AI, so it works while AI is down (spec: docs/specs/f10-reviews.md).
      Reviews carry a client-made id: an offline queue can resend them safely.
  - name: quizzes
    description: |
      Multiple-choice quizzes the AI writes from a document or page range, graded by code
      (spec: docs/specs/f11-quizzes.md). Correct answers only appear in attempt results.
  - name: summaries
    description: |
      Chapter summaries made on request, saved and reused (spec: docs/specs/f12-summaries.md).
security:
  - BearerAuth: []
  - CookieAuth: []
paths:
  /health:
    get:
      tags: [system]
      operationId: getHealth
      summary: Liveness probe
      description: Returns 200 when the API process is up. Does not touch the database or Redis.
      security: []
      responses:
        "200":
          description: API process is alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /v1/system/status:
    get:
      tags: [system]
      operationId: getSystemStatus
      summary: Dependency status (database, Redis)
      description: |
        Checks each backing service the API needs. Always returns 200 with an overall
        `status`; a failing dependency is reported as `down` instead of an HTTP error,
        so clients can show which part is unavailable. Never exposes connection strings
        or internal error messages.
      security: []
      responses:
        "200":
          description: Status report of the API and its dependencies
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemStatusResponse"
  /v1/auth/register:
    post:
      tags: [auth]
      operationId: register
      summary: Create an account with email and password and start a session
      security: []
      parameters:
        - $ref: "#/components/parameters/ClientPlatform"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Account created and signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "403":
          $ref: "#/components/responses/CsrfRejected"
        "409":
          description: "`EMAIL_UNAVAILABLE`: generic message; the client suggests signing in or resetting the password."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: "`VALIDATION_ERROR`, or `WEAK_PASSWORD` with `reason`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/TooManyAttempts"
  /v1/auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Sign in with email and password
      description: |
        A wrong email and a wrong password return the same `INVALID_CREDENTIALS` response.
        `ACCOUNT_BLOCKED` is only returned when the password is correct.
      security: []
      parameters:
        - $ref: "#/components/parameters/ClientPlatform"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "401":
          description: "`INVALID_CREDENTIALS`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: "`ACCOUNT_BLOCKED` or `CSRF_REJECTED`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyAttempts"
  /v1/auth/refresh:
    post:
      tags: [auth]
      operationId: refreshSession
      summary: Rotate the refresh token and issue a new access token
      description: |
        Native sends `refresh_token` in the body; web sends the `refresh_token` cookie.
        The used refresh token stops working. Presenting an already-rotated token revokes
        every token of that sign-in (suspected theft).
      security: []
      parameters:
        - $ref: "#/components/parameters/ClientPlatform"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenRequest"
      responses:
        "200":
          description: New session tokens
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "401":
          description: "`INVALID_REFRESH_TOKEN`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: "`ACCOUNT_BLOCKED` or `CSRF_REJECTED`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          $ref: "#/components/responses/ValidationError"
  /v1/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Revoke the current refresh token and clear web cookies
      description: Always 204, even when the token is missing or already invalid.
      security: []
      parameters:
        - $ref: "#/components/parameters/ClientPlatform"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenRequest"
      responses:
        "204":
          description: Signed out
        "403":
          $ref: "#/components/responses/CsrfRejected"
        "422":
          $ref: "#/components/responses/ValidationError"
  /v1/auth/email-verification:
    post:
      tags: [auth]
      operationId: sendEmailVerification
      summary: Email a fresh 6-digit verification code (no-op when already verified)
      description: Registration already sends one. At most one per minute and 5 per hour.
      responses:
        "204":
          description: Sent (or nothing to do)
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/CsrfRejected"
        "429":
          $ref: "#/components/responses/TooManyAttempts"
  /v1/auth/email-verification/confirm:
    post:
      tags: [auth]
      operationId: confirmEmailVerification
      summary: Verify the email with the emailed code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyEmailRequest"
      responses:
        "200":
          description: Verified; the updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/InvalidCode"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/CsrfRejected"
        "422":
          $ref: "#/components/responses/ValidationError"
  /v1/auth/password-reset:
    post:
      tags: [auth]
      operationId: requestPasswordReset
      summary: Email a password reset code if the account exists
      description: |
        Always 202 with no body, whether or not the email exists or the request was rate
        limited, so it cannot reveal accounts. Google-only accounts get a pointer to Google sign-in.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetRequest"
      responses:
        "202":
          description: Accepted
        "403":
          $ref: "#/components/responses/CsrfRejected"
        "422":
          $ref: "#/components/responses/ValidationError"
  /v1/auth/password-reset/confirm:
    post:
      tags: [auth]
      operationId: confirmPasswordReset
      summary: Set a new password with the emailed code; signs out every session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetConfirmRequest"
      responses:
        "204":
          description: Password changed; all refresh tokens revoked; email marked verified
        "400":
          $ref: "#/components/responses/InvalidCode"
        "403":
          $ref: "#/components/responses/CsrfRejected"
        "422":
          description: "`VALIDATION_ERROR`, or `WEAK_PASSWORD` with `reason`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/me:
    get:
      tags: [users]
      operationId: getMe
      summary: The signed-in user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          description: "`ACCOUNT_BLOCKED`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      tags: [users]
      operationId: updateMe
      summary: Change the interface language (kept per account)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMeRequest"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/CsrfRejected"
        "422":
          $ref: "#/components/responses/ValidationError"
  /v1/me/deletion:
    post:
      tags: [users]
      operationId: deleteMe
      summary: Permanently delete the account and all its data
      description: Password accounts send `password`; Google-only accounts retype their email in `confirm_email`.
      parameters:
        - $ref: "#/components/parameters/ClientPlatform"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteAccountRequest"
      responses:
        "204":
          description: Deleted; web session cookies cleared
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          description: "`INVALID_PASSWORD` or `CSRF_REJECTED`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: "`VALIDATION_ERROR` or `CONFIRMATION_MISMATCH`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/TooManyAttempts"
  /v1/auth/password/change:
    post:
      tags: [auth]
      operationId: changePassword
      summary: Change the password; signs out every other session and returns a fresh one
      parameters:
        - $ref: "#/components/parameters/ClientPlatform"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "200":
          description: New session (tokens in the body for native, cookies for web)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          description: "`INVALID_PASSWORD` or `CSRF_REJECTED`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: "`NO_PASSWORD`: Google-only account"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: "`VALIDATION_ERROR`, or `WEAK_PASSWORD` with `reason`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/TooManyAttempts"
  /v1/me/consents:
    get:
      tags: [users]
      operationId: listMyConsents
      summary: Notices the caller accepted, plus the current version of each
      responses:
        "200":
          description: Consents
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsentList"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
    post:
      tags: [users]
      operationId: giveConsent
      summary: Accept the current version of a notice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConsentRequest"
      responses:
        "201":
          description: Recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Consent"
        "200":
          description: Already recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Consent"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/CsrfRejected"
        "422":
          description: "`VALIDATION_ERROR`, e.g. not the current version (`current_version` is returned)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/documents:
    post:
      tags: [documents]
      operationId: uploadDocument
      summary: Upload a PDF and queue it for processing
      description: |
        Returns immediately with status QUEUED. A repeat with the same `Idempotency-Key` and the
        same file returns the original document (200) instead of creating a duplicate.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: PDF or Word (.docx), at most `max_size_mb` (20) MB and 200 pages.
                space_id:
                  type: string
                  format: uuid
                  description: Required unless the caller has no space yet (then one is created from the file name).
      responses:
        "202":
          description: Accepted and queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
        "200":
          description: Replay of an earlier upload with the same Idempotency-Key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          description: "`CONSENT_REQUIRED` (with `version`), `EMAIL_NOT_VERIFIED` or `CSRF_REJECTED`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "`DOCUMENT_LIMIT_REACHED` (with `max_documents`) or `IDEMPOTENCY_KEY_REUSED`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: "`FILE_TOO_LARGE` (with `max_size_mb`)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "415":
          description: "`FILE_TYPE_NOT_SUPPORTED`: not a PDF or .docx (checked by content, not extension)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: "`TOO_MANY_PAGES` (with `max_pages`), `PDF_ENCRYPTED`, `SPACE_REQUIRED` or `VALIDATION_ERROR`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    get:
      tags: [documents]
      operationId: listDocuments
      summary: Documents in one of the caller's spaces, newest first
      parameters:
        - name: space_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Documents (DELETING ones are hidden)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentList"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
  /v1/documents/{document_id}:
    parameters:
      - name: document_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [documents]
      operationId: getDocument
      summary: One document (for status polling)
      responses:
        "200":
          description: The document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      tags: [documents]
      operationId: deleteDocument
      summary: Delete a document
      description: |
        The document becomes DELETING at once (hidden from lists and search); the file, chunks,
        vectors and jobs are removed in the background (spec: docs/specs/f6-document-management.md).
      responses:
        "204":
          description: Deletion started
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/CsrfRejected"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
  /v1/documents/{document_id}/retry:
    parameters:
      - name: document_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [documents]
      operationId: retryDocument
      summary: Queue a FAILED or PAUSED_QUOTA document again
      responses:
        "200":
          description: Queued again
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/CsrfRejected"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "`DOCUMENT_NOT_RETRYABLE` (with the current `status`)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          $ref: "#/components/responses/ValidationError"
  /v1/documents/{document_id}/pages/{page}:
    parameters:
      - name: document_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: page
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
    get:
      tags: [documents]
      operationId: getDocumentPage
      summary: The text of one page, split into paragraphs (citation view)
      responses:
        "200":
          description: The page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentPage"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "`DOCUMENT_NOT_READY`: the document is not READY"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          $ref: "#/components/responses/ValidationError"
  /v1/documents/{document_id}/sections:
    parameters:
      - name: document_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [summaries]
      operationId: listDocumentSections
      summary: The document's chapters (or page-range parts) with saved summaries
      description: |
        Chapters come from headings in the document, found once and kept; without usable
        headings the document is split into fixed page ranges (`title` is null).
      responses:
        "200":
          description: Sections in reading order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SectionList"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "`DOCUMENT_NOT_READY`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          $ref: "#/components/responses/ValidationError"
  /v1/documents/{document_id}/sections/{section_id}/summary:
    parameters:
      - name: document_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: section_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [summaries]
      operationId: summarizeSection
      summary: Make the summary of one section (or return the saved one)
      responses:
        "200":
          description: Already made earlier; no quota used
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Summary"
        "201":
          description: Made now; uses the daily summary quota (`Usage.summaries`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Summary"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/CsrfRejected"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "`DOCUMENT_NOT_READY`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: "`VALIDATION_ERROR`, or `SOURCE_EMPTY` when the section has no text"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/UserQuotaExceeded"
        "503":
          $ref: "#/components/responses/AiUnavailable"
  /v1/documents/{document_id}/move:
    parameters:
      - name: document_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [documents]
      operationId: moveDocument
      summary: Move a document to another of the caller's spaces
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MoveDocumentRequest"
      responses:
        "200":
          description: Moved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/CsrfRejected"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
  /v1/spaces:
    get:
      tags: [spaces]
      operationId: listSpaces
      summary: The caller's spaces, most recently updated first
      responses:
        "200":
          description: All spaces of the caller (not paginated)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpaceList"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
    post:
      tags: [spaces]
      operationId: createSpace
      summary: Create a space
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpaceNameRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Space"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/CsrfRejected"
        "409":
          $ref: "#/components/responses/SpaceNameTaken"
        "422":
          $ref: "#/components/responses/ValidationError"
  /v1/spaces/{space_id}:
    parameters:
      - $ref: "#/components/parameters/SpaceId"
    get:
      tags: [spaces]
      operationId: getSpace
      summary: One space
      responses:
        "200":
          description: The space
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Space"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
    patch:
      tags: [spaces]
      operationId: renameSpace
      summary: Rename a space
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpaceNameRequest"
      responses:
        "200":
          description: Renamed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Space"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/CsrfRejected"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/SpaceNameTaken"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      tags: [spaces]
      operationId: deleteSpace
      summary: Delete a space and everything in it
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/CsrfRejected"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
  /v1/usage/me:
    get:
      tags: [usage]
      operationId: getMyUsage
      summary: Today's question quota (resets at local midnight, UTC+7)
      responses:
        "200":
          description: Quota status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Usage"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
  /v1/conversations:
    get:
      tags: [chat]
