        source:
          type: [object, "null"]
          additionalProperties: false
          required: [document_id]
          properties:
            document_id:
              type: string
              format: uuid
            page:
              type: [integer, "null"]
              minimum: 1
    CreateFlashcardsRequest:
      type: object
      additionalProperties: false
      required: [deck_id, cards]
      properties:
        deck_id:
          type: string
          format: uuid
        cards:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: "#/components/schemas/NewFlashcard"
    UpdateFlashcardRequest:
      type: object
      additionalProperties: false
      properties:
        front:
          type: [string, "null"]
          minLength: 1
