openapi: "3.1.0"
info:
  title: FlashCard API
  description: |
    API for the FlashCard learning assistant app.
    Contract-first: this file is the single source of truth (see contract/README.md).
  version: "1.0.0"
servers:
  - url: http://localhost:8000
    description: Local development
tags:
  - name: system
    description: Liveness and dependency status
  - name: auth
    description: |
      Email + password sign-up, sign-in, session refresh and sign-out (spec: docs/specs/f2-email-auth.md).
      Native clients receive tokens in the JSON body and keep them in secure storage.
      Web clients receive httpOnly cookies instead and never see tokens (R12).
  - name: users
    description: The signed-in user
  - name: documents
    description: |
      PDF upload and background ingestion to READY (spec: docs/specs/f5-document-upload.md).
      Status follows the state machine in docs/DATA_MODEL.md; clients poll while UPLOADED, QUEUED or PROCESSING.
  - name: spaces
    description: |
      Study spaces that group documents, chats, decks and quizzes (spec: docs/specs/f4b-spaces.md).
      Other users' spaces always answer 404, never 403.
security:
  - BearerAuth: []
  - CookieAuth: []
paths:
  /health:
    get:
      tags: [system]
      operationId: getHealth
      summary: Liveness probe
      description: Returns 200 when the API process is up. Does not touch the database or Redis.
      security: []
      responses:
        "200":
          description: API process is alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /v1/system/status:
    get:
      tags: [system]
      operationId: getSystemStatus
      summary: Dependency status (database, Redis)
      description: |
        Checks each backing service the API needs. Always returns 200 with an overall
        `status`; a failing dependency is reported as `down` instead of an HTTP error,
        so clients can show which part is unavailable. Never exposes connection strings
        or internal error messages.
      security: []
      responses:
        "200":
          description: Status report of the API and its dependencies
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemStatusResponse"
  /v1/auth/register:
    post:
      tags: [auth]
      operationId: register
      summary: Create an account with email and password and start a session
      security: []
      parameters:
        - $ref: "#/components/parameters/ClientPlatform"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Account created and signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "403":
          $ref: "#/components/responses/CsrfRejected"
        "409":
          description: "`EMAIL_UNAVAILABLE`: generic message; the client suggests signing in or resetting the password."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: "`VALIDATION_ERROR`, or `WEAK_PASSWORD` with `reason`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/TooManyAttempts"
  /v1/auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Sign in with email and password
      description: |
        A wrong email and a wrong password return the same `INVALID_CREDENTIALS` response.
        `ACCOUNT_BLOCKED` is only returned when the password is correct.
      security: []
      parameters:
        - $ref: "#/components/parameters/ClientPlatform"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "401":
          description: "`INVALID_CREDENTIALS`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: "`ACCOUNT_BLOCKED` or `CSRF_REJECTED`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyAttempts"
  /v1/auth/refresh:
    post:
      tags: [auth]
      operationId: refreshSession
      summary: Rotate the refresh token and issue a new access token
      description: |
        Native sends `refresh_token` in the body; web sends the `refresh_token` cookie.
        The used refresh token stops working. Presenting an already-rotated token revokes
        every token of that sign-in (suspected theft).
      security: []
      parameters:
        - $ref: "#/components/parameters/ClientPlatform"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenRequest"
      responses:
        "200":
          description: New session tokens
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "401":
          description: "`INVALID_REFRESH_TOKEN`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: "`ACCOUNT_BLOCKED` or `CSRF_REJECTED`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          $ref: "#/components/responses/ValidationError"
  /v1/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Revoke the current refresh token and clear web cookies
      description: Always 204, even when the token is missing or already invalid.
      security: []
      parameters:
        - $ref: "#/components/parameters/ClientPlatform"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenRequest"
      responses:
        "204":
          description: Signed out
        "403":
          $ref: "#/components/responses/CsrfRejected"
        "422":
          $ref: "#/components/responses/ValidationError"
  /v1/me:
    get:
      tags: [users]
      operationId: getMe
      summary: The signed-in user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          description: "`ACCOUNT_BLOCKED`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/me/consents:
    get:
      tags: [users]
      operationId: listMyConsents
      summary: Notices the caller accepted, plus the current version of each
      responses:
        "200":
          description: Consents
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsentList"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
    post:
      tags: [users]
      operationId: giveConsent
      summary: Accept the current version of a notice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConsentRequest"
      responses:
        "201":
          description: Recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Consent"
        "200":
          description: Already recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Consent"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/CsrfRejected"
        "422":
          description: "`VALIDATION_ERROR`, e.g. not the current version (`current_version` is returned)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/documents:
    post:
      tags: [documents]
      operationId: uploadDocument
      summary: Upload a PDF and queue it for processing
      description: |
        Returns immediately with status QUEUED. A repeat with the same `Idempotency-Key` and the
        same file returns the original document (200) instead of creating a duplicate.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: PDF, at most `max_size_mb` (20) MB and 200 pages.
                space_id:
                  type: string
                  format: uuid
                  description: Required unless the caller has no space yet (then one is created from the file name).
      responses:
        "202":
          description: Accepted and queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
        "200":
          description: Replay of an earlier upload with the same Idempotency-Key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          description: "`CONSENT_REQUIRED` (with `version`), `EMAIL_NOT_VERIFIED` or `CSRF_REJECTED`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "`DOCUMENT_LIMIT_REACHED` (with `max_documents`) or `IDEMPOTENCY_KEY_REUSED`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: "`FILE_TOO_LARGE` (with `max_size_mb`)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "415":
          description: "`FILE_TYPE_NOT_SUPPORTED`: not a PDF (checked by content, not extension)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: "`TOO_MANY_PAGES` (with `max_pages`), `PDF_ENCRYPTED`, `SPACE_REQUIRED` or `VALIDATION_ERROR`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    get:
      tags: [documents]
      operationId: listDocuments
      summary: Documents in one of the caller's spaces, newest first
      parameters:
        - name: space_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Documents (DELETING ones are hidden)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentList"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
  /v1/documents/{document_id}:
    parameters:
      - name: document_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [documents]
      operationId: getDocument
      summary: One document (for status polling)
      responses:
        "200":
          description: The document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
  /v1/spaces:
    get:
      tags: [spaces]
      operationId: listSpaces
      summary: The caller's spaces, most recently updated first
      responses:
        "200":
          description: All spaces of the caller (not paginated)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpaceList"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
    post:
      tags: [spaces]
      operationId: createSpace
      summary: Create a space
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpaceNameRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Space"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/CsrfRejected"
        "409":
          $ref: "#/components/responses/SpaceNameTaken"
        "422":
          $ref: "#/components/responses/ValidationError"
  /v1/spaces/{space_id}:
    parameters:
      - $ref: "#/components/parameters/SpaceId"
    get:
      tags: [spaces]
      operationId: getSpace
      summary: One space
      responses:
        "200":
          description: The space
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Space"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
    patch:
      tags: [spaces]
      operationId: renameSpace
      summary: Rename a space
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpaceNameRequest"
      responses:
        "200":
          description: Renamed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Space"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/CsrfRejected"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/SpaceNameTaken"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      tags: [spaces]
      operationId: deleteSpace
      summary: Delete a space and everything in it
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/CsrfRejected"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
components:
  parameters:
    SpaceId:
      name: space_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ClientPlatform:
      name: X-Client-Platform
      in: header
      required: true
      description: "`native` returns tokens in the body; `web` sets httpOnly cookies and omits tokens."
      schema:
        type: string
        enum: [web, native]
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token (native clients).
    CookieAuth:
      type: apiKey
      in: cookie
      name: access_token
      description: httpOnly access token cookie (web clients). Unsafe methods also require an allowed `Origin`.
  schemas:
    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Machine-readable error code; the client maps it to an i18n message.
          examples: [VALIDATION_ERROR]
        message:
          type: string
          description: Developer-facing message. Not shown to end users.
        reason:
          type: string
          description: "Set with `WEAK_PASSWORD`."
          enum: [too_short, too_long, too_common, same_as_email]
        retry_after_seconds:
          type: integer
          minimum: 1
          description: "Set with `TOO_MANY_ATTEMPTS`; also sent as the `Retry-After` header."
        version:
          type: string
          description: "Set with `CONSENT_REQUIRED`: the notice version to accept."
        current_version:
          type: string
          description: "Set with `VALIDATION_ERROR` from POST /v1/me/consents."
        max_documents:
          type: integer
          description: "Set with `DOCUMENT_LIMIT_REACHED`."
        max_pages:
          type: integer
          description: "Set with `TOO_MANY_PAGES`."
        max_size_mb:
          type: integer
          description: "Set with `FILE_TOO_LARGE`."
        errors:
          type: array
          description: "Set with `VALIDATION_ERROR`: which fields are invalid."
          items:
            type: object
            required: [field, type]
            properties:
              field:
                type: string
                examples: [email]
              type:
                type: string
                examples: [value_error]
    Locale:
      type: string
      enum: [vi, en]
    ConsentKind:
      type: string
      enum: [ai_processing]
    ConsentRequest:
      type: object
      additionalProperties: false
      required: [kind, version]
      properties:
        kind:
          $ref: "#/components/schemas/ConsentKind"
        version:
          type: string
          maxLength: 64
    Consent:
      type: object
      additionalProperties: false
      required: [kind, version, created_at]
      properties:
        kind:
          $ref: "#/components/schemas/ConsentKind"
        version:
          type: string
        created_at:
          type: string
          format: date-time
    ConsentList:
      type: object
      additionalProperties: false
      required: [items, current_versions]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Consent"
        current_versions:
          type: object
          description: Current notice version per kind; consent is valid only for the current one.
          additionalProperties:
            type: string
    DocumentStatus:
      type: string
      enum: [UPLOADED, QUEUED, PROCESSING, READY, FAILED, PAUSED_QUOTA, DELETING]
    Document:
      type: object
      additionalProperties: false
      required: [id, space_id, filename, size_bytes, page_count, status, error_code, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        space_id:
          type: string
          format: uuid
        filename:
          type: string
        size_bytes:
          type: integer
        page_count:
          type: integer
        status:
          $ref: "#/components/schemas/DocumentStatus"
        error_code:
          type: [string, "null"]
          enum: [NO_TEXT_LAYER, EXTRACTION_FAILED, PROCESSING_FAILED, null]
          description: Set when status is FAILED.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    DocumentList:
      type: object
      additionalProperties: false
      required: [items, total_documents, max_documents]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Document"
        total_documents:
          type: integer
          description: Documents counted toward the per-user limit, across all spaces.
        max_documents:
          type: integer
    SpaceNameRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          maxLength: 200
          description: |
            Trimmed and whitespace-collapsed by the server; must then be 1-100 characters.
            Unique per user, case-insensitive (`SPACE_NAME_TAKEN`).
    Space:
      type: object
      additionalProperties: false
      required: [id, name, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 100
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    SpaceList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Space"
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          maxLength: 1024
          description: Strength rules are checked by the server (`WEAK_PASSWORD`), see the spec.
        locale:
          $ref: "#/components/schemas/Locale"
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          maxLength: 254
        password:
          type: string
          maxLength: 1024
    RefreshTokenRequest:
      type: object
      additionalProperties: false
      properties:
        refresh_token:
          type: string
          maxLength: 512
          description: Required for native clients; ignored for web (the cookie is used).
    User:
      type: object
      additionalProperties: false
      required: [id, email, email_verified, locale, role, created_at]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        email_verified:
          type: boolean
        locale:
          $ref: "#/components/schemas/Locale"
        role:
          type: string
          enum: [user, admin]
        created_at:
          type: string
          format: date-time
    AuthSession:
      type: object
      additionalProperties: false
      required: [user, access_token_expires_in]
      properties:
        user:
          $ref: "#/components/schemas/User"
        access_token:
          type: string
          description: Native only. Absent for web clients.
        refresh_token:
          type: string
          description: Native only. Absent for web clients.
        access_token_expires_in:
          type: integer
          description: Seconds until the access token expires.
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status, environment, version]
      properties:
        status:
          type: string
          const: ok
        environment:
          type: string
          enum: [development, staging, production]
        version:
          type: string
          examples: ["1.0.0"]
    DependencyStatus:
      type: string
      enum: [up, down]
    DependencyCheck:
      type: object
      additionalProperties: false
      required: [status, latency_ms]
      properties:
        status:
          $ref: "#/components/schemas/DependencyStatus"
        latency_ms:
          type: number
          minimum: 0
          description: Time the check took, in milliseconds.
        error_code:
          type: [string, "null"]
          description: Set only when status is down. Stable code, no internal details.
          enum: [TIMEOUT, UNREACHABLE, EXTENSION_MISSING, null]
    DatabaseCheck:
      type: object
      additionalProperties: false
      required: [status, latency_ms]
      properties:
        status:
          $ref: "#/components/schemas/DependencyStatus"
        latency_ms:
          type: number
          minimum: 0
        error_code:
          type: [string, "null"]
          enum: [TIMEOUT, UNREACHABLE, EXTENSION_MISSING, null]
        pgvector_version:
          type: [string, "null"]
          description: Installed pgvector version; null when the database is down or the extension is missing.
          examples: ["0.8.7"]
    SystemStatusResponse:
      type: object
      additionalProperties: false
      required: [status, version, checks]
      properties:
        status:
          type: string
          enum: [ok, degraded]
          description: "`ok` when every dependency is up, otherwise `degraded`."
        version:
          type: string
        checks:
          type: object
          additionalProperties: false
          required: [database, redis]
          properties:
            database:
              $ref: "#/components/schemas/DatabaseCheck"
            redis:
              $ref: "#/components/schemas/DependencyCheck"
  responses:
    NotFound:
      description: "`NOT_FOUND`: does not exist or belongs to someone else"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    SpaceNameTaken:
      description: "`SPACE_NAME_TAKEN`: the caller already has a space with this name (case-insensitive)"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    TooManyAttempts:
      description: "`TOO_MANY_ATTEMPTS` with `retry_after_seconds` and a `Retry-After` header."
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ValidationError:
      description: "`VALIDATION_ERROR`"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    CsrfRejected:
      description: "`CSRF_REJECTED`: cookie-authenticated unsafe request from an origin that is not allowed."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    UnauthorizedError:
      description: "`UNAUTHORIZED`: access token missing, invalid or expired"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
