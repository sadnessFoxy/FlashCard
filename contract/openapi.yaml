          format: uuid
        space_id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 100
        card_count:
          type: integer
          minimum: 0
        due_count:
          type: integer
          minimum: 0
          description: Cards due for review now.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        cards:
          type: array
          items:
            $ref: "#/components/schemas/Flashcard"
    CardSource:
      description: Where a card comes from; a snapshot that survives document deletion.
