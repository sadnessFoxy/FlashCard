            Trimmed and whitespace-collapsed by the server; must then be 1-100 characters.
            Unique per user, case-insensitive (`SPACE_NAME_TAKEN`).
    Space:
      type: object
      additionalProperties: false
      required: [id, name, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 100
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    SpaceList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Space"
    RegisterRequest:
      type: object
      additionalProperties: false
