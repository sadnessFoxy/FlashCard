          format: uuid
        deck_id:
          type: string
          format: uuid
        front:
          type: string
        back:
          type: string
        origin:
          type: string
          enum: [ai, manual]
        source:
          $ref: "#/components/schemas/CardSource"
        due_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    FlashcardList:
      type: object
      additionalProperties: false
