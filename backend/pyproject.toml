[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flashcard-backend"
version = "1.0.0"
description = "FlashCard learning assistant backend API"
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    # Database
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.30.0",
    "alembic>=1.13.0",
    "psycopg2-binary>=2.9.9",
    "pgvector>=0.3.0",
    # Cache & queue
    "redis>=5.0.0",
    "arq>=0.26.0",
    # Validation & settings
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    # Security
    "pyjwt>=2.9.0",
    "argon2-cffi>=23.1.0",
    "email-validator>=2.2.0",
    # File handling
    "python-multipart>=0.0.17",
    "pypdf>=5.1.0",
    "boto3>=1.35.0",
    "aiofiles>=24.1.0",
    # HTTP client
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    # Linting & formatting
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "types-aiofiles",
    "boto3-stubs[s3]",
    # Testing
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0",
    "jsonschema>=4.23.0",
    "types-pyyaml",
    "types-jsonschema",
    "factory-boy>=3.3.0",
    "faker>=30.0.0",
]

[tool.setuptools.package-data]
"app.modules.auth" = ["data/*.txt"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "S",   # flake8-bandit (security)
    "N",   # pep8-naming
]
ignore = [
    "S101",  # assert (tests)
    "S104",  # bind to 0.0.0.0 (containers)
    "B008",  # FastAPI Depends() trong function arguments
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S", "N"]
"alembic/**/*.py" = ["N"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
exclude = ["alembic/", "tests/"]

[[tool.mypy.overrides]]
module = ["arq.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=app --cov-report=term-missing"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
# SQLAlchemy async runs code in greenlets; without this, lines after awaits look uncovered.
concurrency = ["greenlet", "thread"]
source = ["app"]
omit = ["tests/*", "alembic/*"]
