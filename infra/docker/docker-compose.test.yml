version: "3.9"

# Docker Compose cho integration test
# Dùng: docker compose -f infra/docker/docker-compose.test.yml up -d
# Tuân thủ R11: database riêng cho test, không dùng production DB

services:
  postgres-test:
    image: pgvector/pgvector:pg16
    container_name: flashcard-postgres-test
    environment:
      POSTGRES_USER: flashcard_test
      POSTGRES_PASSWORD: flashcard_test
      POSTGRES_DB: flashcard_test
    ports:
      - "5433:5432"   # Port khác để không xung đột với dev
    volumes:
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    # Dùng tmpfs để test nhanh hơn (không cần persistence)
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flashcard_test -d flashcard_test"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis-test:
    image: redis:7-alpine
    container_name: flashcard-redis-test
    ports:
      - "6380:6379"   # Port khác
    tmpfs:
      - /data
