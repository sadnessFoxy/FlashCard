
# Docker Compose cho local development
# Usage: docker compose -f infra/docker/docker-compose.yml up -d

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: flashcard-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: flashcard
      POSTGRES_PASSWORD: flashcard
      POSTGRES_DB: flashcard
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flashcard -d flashcard"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: flashcard-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    container_name: flashcard-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI: http://localhost:8025
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"

  # S3-compatible storage for local dev (replaces MinIO, whose image is no longer pullable).
  # No S3 identities configured, so any key is accepted: local use ONLY.
  s3:
    image: chrislusf/seaweedfs:latest
    container_name: flashcard-s3
    restart: unless-stopped
    # Each bucket grows 7 volumes; small volumes keep disk use low on a dev machine.
    command: server -dir=/data -s3 -s3.port=8333 -volume.max=100 -master.volumeSizeLimitMB=64
    ports:
      - "9000:8333"   # S3 API at http://localhost:9000 (S3_ENDPOINT_URL)
    volumes:
      - s3_data:/data

volumes:
  postgres_data:
  redis_data:
  s3_data:
