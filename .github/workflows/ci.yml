name: CI

# CI/CD is on hold (docs/DECISIONS.md, 2026-11-10): manual runs only.
# To re-enable, restore the push/pull_request triggers below.
on:
  workflow_dispatch:
  # push:
  #   branches: [main, develop]
  # pull_request:
  #   branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-lint:
    name: Backend lint & typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy app

  backend-test:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # R11: dedicated test database, never dev or prod
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: flashcard_test
          POSTGRES_PASSWORD: flashcard_test
          POSTGRES_DB: flashcard_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgresql+asyncpg://flashcard_test:flashcard_test@localhost:5432/flashcard_test
      TEST_REDIS_URL: redis://localhost:6379/15
      SECRET_KEY: ci-test-secret-key-not-for-production

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - run: pip install -e ".[dev]"

      - name: Enable pgvector in test database
        env:
          PGPASSWORD: flashcard_test
        run: psql -h localhost -U flashcard_test -d flashcard_test -c "CREATE EXTENSION IF NOT EXISTS vector"

      - run: pytest

  frontend:
    name: Frontend lint, typecheck & tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Generated API types match contract (R2)
        run: |
          npm run gen-api
          git diff --exit-code -- src/api/generated \
            || (echo "::error::src/api/generated is out of sync with contract/openapi.yaml. Run 'make gen-api' and commit." && exit 1)

      - run: npm run lint
      - run: npm run typecheck
      - run: npx jest --watchAll=false

  contract-breaking-changes:
    name: Contract breaking changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compare contract with base branch
        run: |
          if ! git show "origin/${{ github.base_ref }}:contract/openapi.yaml" > /tmp/base-openapi.yaml 2>/dev/null; then
            echo "Base branch has no contract yet; skipping."
            exit 0
          fi
          docker run --rm -v /tmp:/base -v "$PWD/contract:/head" tufin/oasdiff \
            breaking /base/base-openapi.yaml /head/openapi.yaml --fail-on ERR
